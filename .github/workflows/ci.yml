name: CI

on:
  push:
    branches: [main, Architecture_v2]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build + No-GL unit tests
  # Runs on the standard GitHub-hosted Windows runner (no GPU required).
  # ─────────────────────────────────────────────────────────────────────────
  no-gl-tests:
    name: Build + No-GL Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Clone the latest vcpkg — needed because SDL3 was only added in 2024,
      # and any pinned 2023 commit lacks the port.
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=${{ github.workspace }}\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Cache the installed package tree. Key: OS + vcpkg.json contents.
      # A vcpkg.json change invalidates the cache and triggers a full reinstall.
      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-x64-${{ hashFiles('vcpkg.json') }}

      # Manifest mode: vcpkg reads vcpkg.json in the repo root automatically.
      - name: Install vcpkg packages
        shell: pwsh
        run: .\vcpkg\vcpkg.exe install --triplet x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=ON `
            -A x64

      # Only build the test target — the main executable needs a display
      # and is unnecessary on this runner.
      - name: Build
        run: cmake --build build --config Release --target tests_no_gl --parallel

      - name: Run No-GL Tests
        run: ctest --test-dir build -L NoGL -C Release --output-on-failure

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: GL tests
  # Runs on a self-hosted runner that has a GPU and OpenGL 4.5 drivers.
  # Label your runner with [self-hosted, windows, gl] in GitHub repo settings.
  # Setup guide: temp/Testing/.github/runner_setup.md
  # ─────────────────────────────────────────────────────────────────────────
  gl-tests:
    name: GL Tests (Self-Hosted)
    runs-on: [self-hosted, windows, gl]
    # Run GL tests even if no-gl-tests failed, so we get independent feedback
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=ON `
            -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run GL Tests
        run: ctest --test-dir build -L GL -C Release --output-on-failure
