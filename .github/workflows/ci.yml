name: CI

on:
  push:
    branches: [main, Architecture_v2]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build + No-GL unit tests
  # Runs on the standard GitHub-hosted Windows runner (no GPU required).
  # ─────────────────────────────────────────────────────────────────────────
  no-gl-tests:
    name: Build + No-GL Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # windows-latest ships vcpkg preinstalled as a FULL git clone (not
      # shallow/partial) at C:\vcpkg, already bootstrapped — see
      # actions/runner-images Windows2022-Readme.md. Using it instead of
      # cloning vcpkg fresh avoids the network calls that caused
      # intermittent CI failures: vcpkg's versioning feature does a lazy,
      # per-dependency blob fetch against the vcpkg repo whenever the local
      # clone is partial (--filter=blob:none, the old approach here), and
      # any one of those many per-port fetches failing (e.g. a transient
      # DNS blip) broke the whole install. A full clone already has every
      # historical blob on disk, so no per-port network round-trip happens
      # at all.
      - name: Use preinstalled vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT not set by the runner image -- the preinstalled-vcpkg assumption this step relies on broke."
          }
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Best-effort refresh in case vcpkg.json's builtin-baseline is
          # newer than this runner image's last vcpkg sync. One `git fetch`
          # is a single network round-trip (not the dozen+ per-port fetches
          # the old approach triggered), and if it fails, the pinned
          # baseline is usually already present locally anyway.
          git -C $env:VCPKG_INSTALLATION_ROOT fetch origin --quiet

      # Cache the installed package tree. Key: OS + vcpkg.json contents.
      # A vcpkg.json change invalidates the cache and triggers a full reinstall.
      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-x64-${{ hashFiles('vcpkg.json') }}

      # Manifest mode: vcpkg reads vcpkg.json in the repo root automatically.
      - name: Install vcpkg packages
        shell: pwsh
        run: & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=ON `
            -A x64

      # Only build the test target — the main executable needs a display
      # and is unnecessary on this runner.
      - name: Build
        run: cmake --build build --config Release --target tests_no_gl --parallel

      - name: Run No-GL Tests
        run: ctest --test-dir build -L NoGL -C Release --output-on-failure

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: GL tests
  # Runs on a self-hosted runner that has a GPU and OpenGL 4.5 drivers.
  # Label your runner with [self-hosted, windows, gl] in GitHub repo settings.
  # Setup guide: temp/Testing/.github/runner_setup.md
  # ─────────────────────────────────────────────────────────────────────────
  gl-tests:
    name: GL Tests (Self-Hosted)
    runs-on: [self-hosted, windows, gl]
    # Run GL tests even if no-gl-tests failed, so we get independent feedback
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=ON `
            -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run GL Tests
        run: ctest --test-dir build -L GL -C Release --output-on-failure
